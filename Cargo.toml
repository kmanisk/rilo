[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/dlengine",
    "crates/dlman-types",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["Rilo Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["stream", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["io"] }
directories = "5.0"
dirs = "5.0"
futures = "0.3"

# Internal crates
dlengine = { path = "crates/dlengine" }
dlman-types = { path = "crates/dlman-types" }
