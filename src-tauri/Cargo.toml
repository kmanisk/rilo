[package]
name = "downloader"
version = "1.1.0"
description = "Rilo Desktop Downloader"
authors = ["Rilo Team"]
edition = "2021"
default-run = "downloader"

[lib]
name = "downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "downloader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["stream"] }
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.33"
tokio-util = "0.7.19"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2"
drag = "2.1"
urlencoding = "2.1.3"
zip = "2.2.2"
tar = "0.4.43"
flate2 = "1.0.35"
bzip2 = "0.6.0"
xz2 = "0.1.7"
sevenz-rust = "0.6.1"
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Cryptography"] }
dlengine = { path = "../crates/dlengine" }
dlman-types = { path = "../crates/dlman-types" }
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
dirs = "5.0"

[dev-dependencies]
tempfile = "3"
