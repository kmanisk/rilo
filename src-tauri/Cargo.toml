[package]
name = "downloader"
version = "0.1.0"
description = "Rilo Desktop Downloader"
authors = ["Rilo Team"]
edition = "2021"
default-run = "downloader"

[lib]
name = "downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "downloader"
path = "src/main.rs"

[[bin]]
name = "rilo-host"
path = "src/bin/rilo_host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["stream"] }
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.33"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio-util = "0.7.19"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
urlencoding = "2.1.3"
zip = "2.2.2"
tar = "0.4.43"
flate2 = "1.0.35"
bzip2 = "0.6.0"
xz2 = "0.1.7"
sevenz-rust = "0.6.1"
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }


